    if (providers.gradleProperty('hardrushFullFlow').orNull == 'true') doFirst {
        fullFlowRunDir.mkdirs()
        copy { from acceptedEula; into fullFlowRunDir }
        logger.lifecycle("Isolated full flow storage: ${fullFlowRunDir}")
    }
}

// Round 5 owns the production camp, twenty native connections and sequential worlds.
def stabilizationRunDir = rootProject.file(".local/lobby-stabilization/${UUID.randomUUID()}")
loom.runs.named('gameTest') {
    if (providers.gradleProperty('hardrushStabilization').orNull == 'true') {
        if (providers.gradleProperty('hardrushCompetition').orNull != 'true') throw new GradleException('Stabilization requires competition mode')
        vmArg '-Dhardrush.test.stabilization=true'
        vmArg '-Dhardrush.round.initialMode=hardcore'
        vmArg '-Dfabric-api.gametest.filter=hardrush-gametest:stabilization_game_test*'
        runDir stabilizationRunDir.absolutePath
    }
}
tasks.named('runGameTest') {
    if (providers.gradleProperty('hardrushStabilization').orNull == 'true') doFirst {
        stabilizationRunDir.mkdirs()
        copy { from acceptedEula; into stabilizationRunDir }
        logger.lifecycle("Isolated stabilization storage: ${stabilizationRunDir}")
    }
}
