}

loom {
    runs {
        server {
            server()
            runDir rootProject.file('.local/server').absolutePath
            programArg 'nogui'
        }
        debugServer {
            server()
            runDir rootProject.file('.local/debug/server').absolutePath
            programArg 'nogui'
            vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
        }
        debugClient {
            client()
            runDir rootProject.file('.local/debug/client').absolutePath
            programArgs '--username', 'HRDebug', '--offlineDeveloperMode', '--quickPlayMultiplayer', '127.0.0.1:25586'
            vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5006'
        }
    }
}

tasks.named('runServer') { standardInput = System.in }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'hardrush-gametest'
        enableGameTests = true
        enableClientGameTests = true
        // The helper copies the existing accepted EULA; it never accepts it for the user.
        eula = false
    }
}

// Operator probes are available only to development tooling and the test mod.
sourceSets.gametest.compileClasspath += sourceSets.development.output
sourceSets.gametest.runtimeClasspath += sourceSets.development.output
sourceSets.test.compileClasspath += sourceSets.development.output
sourceSets.test.runtimeClasspath += sourceSets.development.output

// Crash barriers belong only to the test mod; release code never imports SQLite test hooks.
dependencies { gametestImplementation 'org.xerial:sqlite-jdbc:3.53.4.0' }

// A normal, headless dedicated server with the test mod loaded. It deliberately
// does not inherit gameTest's runner properties: restart evidence needs real JVM exits.
def restartPhases = ['PREPARING', 'WAITING', 'COUNTDOWN', 'RUNNING', 'RESCUE', 'SETTLING', 'CELEBRATING', 'ROTATING']
def restartPhase = providers.gradleProperty('hardrushRestartPhase').orElse('WAITING').get()
def restartOperation = providers.gradleProperty('hardrushRestartOperation').orElse('write').get()
def restartBase = rootProject.file('.local/server-restart').toPath().toAbsolutePath().normalize()
def restartDirectory = rootProject.file(providers.gradleProperty('hardrushRestartDirectory')
        .orElse('.local/server-restart/launch-template').get()).toPath().toAbsolutePath().normalize()
if (!restartPhases.contains(restartPhase) || !['write', 'recover'].contains(restartOperation)) {
    throw new GradleException('Invalid restart phase or operation')
}
if (!restartDirectory.startsWith(restartBase) || restartDirectory == restartBase) {
    throw new GradleException('Restart storage must be a scenario below .local/server-restart')
}
loom {
    runs {
        restartServer {
            server()
            source sourceSets.gametest
            runDir restartDirectory.toString()
            ideConfigGenerated false
            vmArg '--enable-native-access=ALL-UNNAMED'
            vmArg '-Dhardrush.competition.enabled=true'
            vmArg '-Dhardrush.round.initialMode=normal'
            vmArg "-Dhardrush.test.restart.phase=${restartPhase}"
            vmArg "-Dhardrush.test.restart.operation=${restartOperation}"
            vmArg "-Dhardrush.test.restart.directory=${restartDirectory}"
        }
    }
}

tasks.named('runRestartServer') {
    doFirst {
        def eula = restartDirectory.resolve('eula.txt').toFile()
        if (!eula.isFile() || !eula.readLines().collect { it.trim() }.contains('eula=true')) {
            throw new GradleException('Use scripts/server-restart.py to copy the existing accepted EULA and prepare isolated storage')
        }
    }
}

// Resolve and build Loom's launch once. The Python runner reuses this specification
// across the matrix, starts Java directly, and checks each fixture's actual process ID.
tasks.register('writeRestartLaunchSpec') {
    group = 'verification'
    description = 'Build a headless restart fixture launch specification without starting a server.'
    def launchTask = tasks.named('runRestartServer')
    dependsOn { launchTask.get().taskDependencies.getDependencies(launchTask.get()) }
    dependsOn sourceSets.gametest.runtimeClasspath
    doLast {
        def launch = launchTask.get()
        def run = loom.runs.named('restartServer').get()
        def target = rootProject.file(providers.gradleProperty('hardrushRestartLaunchSpec')
                .orElse('platforms/mc263/build/restart-launch.json').get())
        def programArgs = new ArrayList(launch.args ?: [])
        launch.argumentProviders.each { programArgs.addAll(it.asArguments().toList()) }
        def spec = [schema: 1,
                    java: launch.javaLauncher.get().executablePath.asFile.absolutePath,
                    jvmArgs: launch.allJvmArgs,
                    classpath: launch.classpath.files.collect { it.absolutePath },
                    mainClass: launch.mainClass.get(),
                    programArgs: programArgs,
                    environment: run.environmentVars.get()]
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson(spec)) + '\n'
        logger.lifecycle("Restart launch specification: ${target}")
    }
}

