plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'hardrush' }
version = "${rootProject.hardrush_version}+mc${minecraft_version}"

repositories { maven { url = 'https://maven.nucleoid.xyz/' } }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "xyz.nucleoid:fantasy:${fantasy_version}"
    include "xyz.nucleoid:fantasy:${fantasy_version}"
    implementation project(':core')
    include project(':core')
    implementation project(':persistence')
    include project(':persistence')
    include 'org.xerial:sqlite-jdbc:3.53.4.0'
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

sourceSets {
    debugTools {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
    }
}

tasks.register('debugToolsJar', Jar) {
    archiveBaseName = 'hardrush-debug-tools'
    from sourceSets.debugTools.output
}

loom {
    runs {
        server {
            server()
            runDir rootProject.file('.local/server-p0').absolutePath
            programArg 'nogui'
        }
        debugServer {
            server()
            runDir rootProject.file('.local/debug/server').absolutePath
            programArg 'nogui'
            vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
        }
        debugClient {
            client()
            runDir rootProject.file('.local/debug/client').absolutePath
            programArgs '--username', 'HRDebug', '--offlineDeveloperMode', '--quickPlayMultiplayer', '127.0.0.1:25586'
            vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5006'
        }
    }
}

tasks.named('runServer') { standardInput = System.in }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'hardrush-gametest'
        enableGameTests = true
        enableClientGameTests = true
        // The helper copies the existing accepted EULA; it never accepts it for the user.
        eula = false
    }
}

loom.runs.named('clientGameTest') {
    programArgs '--username', 'HRDebug', '--offlineDeveloperMode'
    vmArg "-Dhardrush.root=${rootProject.projectDir}"
}

// Explicit opt-in for the server-only P1 foundation; never enables a graphical test client.
['server', 'debugServer', 'gameTest'].each { name ->
    loom.runs.named(name) {
        if (providers.gradleProperty('hardrushP1').orNull == 'true') {
            vmArg '-Dhardrush.p1.enabled=true'
            vmArg '--enable-native-access=ALL-UNNAMED'
            if (providers.gradleProperty('hardrushP1InitialMode').isPresent()) {
                vmArg "-Dhardrush.p1.initialMode=${providers.gradleProperty('hardrushP1InitialMode').get()}"
            }
        }
    }
}

// Run the production P1 lifecycle alone: other GameTests intentionally mutate the shared lobby.
def p1RegressionRunDir = rootProject.file(".local/p1-regression/${UUID.randomUUID()}")
loom.runs.named('gameTest') {
    if (providers.gradleProperty('hardrushP1TenRounds').orNull == 'true') {
        if (providers.gradleProperty('hardrushP1').orNull != 'true') {
            throw new GradleException('The ten-round regression requires -PhardrushP1=true')
        }
        vmArg '-Dhardrush.p1.testTenRounds=true'
        vmArg '-Dhardrush.p1.initialMode=normal'
        vmArg '-Dfabric-api.gametest.filter=hardrush-gametest:p1ten_round_game_test*'
        runDir p1RegressionRunDir.absolutePath
    }
}
tasks.named('runGameTest') {
    if (providers.gradleProperty('hardrushP1TenRounds').orNull == 'true') {
        doFirst {
            // prepareDebugTools has already checked the user's accepted EULA; never accept it here.
            p1RegressionRunDir.mkdirs()
            copy {
                from rootProject.file('.local/server-p0/eula.txt')
                into p1RegressionRunDir
            }
            logger.lifecycle("Isolated P1 ten-round storage: ${p1RegressionRunDir}")
        }
    }
}

tasks.register('prepareDebugTools', Exec) {
    commandLine 'python3', rootProject.file('scripts/debug-tools.py'), 'prepare'
}

['runDebugServer', 'runDebugClient', 'runGameTest', 'runClientGameTest'].each { name ->
    tasks.named(name) { dependsOn 'prepareDebugTools' }
}

['runDebugServer': 'server', 'runDebugClient': 'client'].each { name, side ->
    tasks.named(name) {
        dependsOn 'debugToolsJar'
        doFirst {
            copy {
                from tasks.named('debugToolsJar').get().archiveFile
                into rootProject.file(".local/debug/${side}/mods")
            }
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.named('jar') {
    from(rootProject.file('THIRD-PARTY.md'))
    from(rootProject.file('licenses')) { into 'META-INF/licenses' }
}

