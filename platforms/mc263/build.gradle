import groovy.json.JsonOutput

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'hardrush' }
version = "${rootProject.hardrush_version}+mc${minecraft_version}"

repositories { maven { url = 'https://maven.nucleoid.xyz/' } }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "xyz.nucleoid:fantasy:${fantasy_version}"
    include "xyz.nucleoid:fantasy:${fantasy_version}"
    implementation project(':core')
    include project(':core')
    implementation project(':persistence')
    include project(':persistence')
    include 'org.xerial:sqlite-jdbc:3.53.4.0'
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

sourceSets {
    debugTools {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
    }
}

tasks.register('debugToolsJar', Jar) {
    archiveBaseName = 'hardrush-debug-tools'
    from sourceSets.debugTools.output
}

loom {
    runs {
        server {
            server()
            runDir rootProject.file('.local/server-p0').absolutePath
            programArg 'nogui'
        }
        debugServer {
            server()
            runDir rootProject.file('.local/debug/server').absolutePath
            programArg 'nogui'
            vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5005'
        }
        debugClient {
            client()
            runDir rootProject.file('.local/debug/client').absolutePath
            programArgs '--username', 'HRDebug', '--offlineDeveloperMode', '--quickPlayMultiplayer', '127.0.0.1:25586'
            vmArg '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:5006'
        }
    }
}

tasks.named('runServer') { standardInput = System.in }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'hardrush-gametest'
        enableGameTests = true
        enableClientGameTests = true
        // The helper copies the existing accepted EULA; it never accepts it for the user.
        eula = false
    }
}

// Crash barriers belong only to the test mod; release code never imports SQLite test hooks.
dependencies { gametestImplementation 'org.xerial:sqlite-jdbc:3.53.4.0' }

// A normal, headless dedicated server with the test mod loaded. It deliberately
// does not inherit gameTest's runner properties: restart evidence needs real JVM exits.
def p1RestartPhases = ['PREPARING', 'WAITING', 'COUNTDOWN', 'RUNNING', 'SETTLING', 'CELEBRATING', 'ROTATING']
def p1RestartPhase = providers.gradleProperty('hardrushP1RestartPhase').orElse('WAITING').get()
def p1RestartOperation = providers.gradleProperty('hardrushP1RestartOperation').orElse('write').get()
def p1RestartBase = rootProject.file('.local/p1-server-restart').toPath().toAbsolutePath().normalize()
def p1RestartDirectory = rootProject.file(providers.gradleProperty('hardrushP1RestartDirectory')
        .orElse('.local/p1-server-restart/launch-template').get()).toPath().toAbsolutePath().normalize()
if (!p1RestartPhases.contains(p1RestartPhase) || !['write', 'recover'].contains(p1RestartOperation)) {
    throw new GradleException('Invalid P1 restart phase or operation')
}
if (!p1RestartDirectory.startsWith(p1RestartBase) || p1RestartDirectory == p1RestartBase) {
    throw new GradleException('P1 restart storage must be a scenario below .local/p1-server-restart')
}
loom {
    runs {
        p1RestartServer {
            server()
            source sourceSets.gametest
            runDir p1RestartDirectory.toString()
            ideConfigGenerated false
            vmArg '--enable-native-access=ALL-UNNAMED'
            vmArg '-Dhardrush.p1.enabled=true'
            vmArg '-Dhardrush.p1.initialMode=normal'
            vmArg "-Dhardrush.p1.restart.phase=${p1RestartPhase}"
            vmArg "-Dhardrush.p1.restart.operation=${p1RestartOperation}"
            vmArg "-Dhardrush.p1.restart.directory=${p1RestartDirectory}"
        }
    }
}

tasks.named('runP1RestartServer') {
    doFirst {
        def eula = p1RestartDirectory.resolve('eula.txt').toFile()
        if (!eula.isFile() || !eula.readLines().collect { it.trim() }.contains('eula=true')) {
            throw new GradleException('Use scripts/p1-server-restart.py to copy the existing accepted EULA and prepare isolated storage')
        }
    }
}

// Resolve and build Loom's launch once. The Python runner reuses this specification
// across the matrix, starts Java directly, and checks each fixture's actual process ID.
tasks.register('writeP1RestartLaunchSpec') {
    group = 'verification'
    description = 'Build a headless P1 restart fixture launch specification without starting a server.'
    def launchTask = tasks.named('runP1RestartServer')
    dependsOn { launchTask.get().taskDependencies.getDependencies(launchTask.get()) }
    dependsOn sourceSets.gametest.runtimeClasspath
    doLast {
        def launch = launchTask.get()
        def run = loom.runs.named('p1RestartServer').get()
        def target = rootProject.file(providers.gradleProperty('hardrushP1RestartLaunchSpec')
                .orElse('platforms/mc263/build/p1-restart-launch.json').get())
        def programArgs = new ArrayList(launch.args ?: [])
        launch.argumentProviders.each { programArgs.addAll(it.asArguments().toList()) }
        def spec = [schema: 1,
                    java: launch.javaLauncher.get().executablePath.asFile.absolutePath,
                    jvmArgs: launch.allJvmArgs,
                    classpath: launch.classpath.files.collect { it.absolutePath },
                    mainClass: launch.mainClass.get(),
                    programArgs: programArgs,
                    environment: run.environmentVars.get()]
        target.parentFile.mkdirs()
        target.text = JsonOutput.prettyPrint(JsonOutput.toJson(spec)) + '\n'
        logger.lifecycle("P1 restart launch specification: ${target}")
    }
}

loom.runs.named('clientGameTest') {
    programArgs '--username', 'HRDebug', '--offlineDeveloperMode'
    vmArg "-Dhardrush.root=${rootProject.projectDir}"
}

// Explicit opt-in for the server-only P1 foundation; never enables a graphical test client.
['server', 'debugServer', 'gameTest'].each { name ->
    loom.runs.named(name) {
        if (providers.gradleProperty('hardrushP1').orNull == 'true') {
            vmArg '-Dhardrush.p1.enabled=true'
            vmArg '--enable-native-access=ALL-UNNAMED'
            if (providers.gradleProperty('hardrushP1InitialMode').isPresent()) {
                vmArg "-Dhardrush.p1.initialMode=${providers.gradleProperty('hardrushP1InitialMode').get()}"
            }
        }
    }
}

// Run the production P1 lifecycle alone: other GameTests intentionally mutate the shared lobby.
def p1RegressionRunDir = rootProject.file(".local/p1-regression/${UUID.randomUUID()}")
loom.runs.named('gameTest') {
    if (providers.gradleProperty('hardrushP1TenRounds').orNull == 'true') {
        if (providers.gradleProperty('hardrushP1').orNull != 'true') {
            throw new GradleException('The ten-round regression requires -PhardrushP1=true')
        }
        vmArg '-Dhardrush.p1.testTenRounds=true'
        vmArg '-Dhardrush.p1.initialMode=normal'
        vmArg '-Dfabric-api.gametest.filter=hardrush-gametest:p1ten_round_game_test*'
        runDir p1RegressionRunDir.absolutePath
    }
}
tasks.named('runGameTest') {
    if (providers.gradleProperty('hardrushP1TenRounds').orNull == 'true') {
        doFirst {
            // prepareDebugTools has already checked the user's accepted EULA; never accept it here.
            p1RegressionRunDir.mkdirs()
            copy {
                from rootProject.file('.local/server-p0/eula.txt')
                into p1RegressionRunDir
            }
            logger.lifecycle("Isolated P1 ten-round storage: ${p1RegressionRunDir}")
        }
    }
}

// Isolate the deliberately impossible disk reserve from all production-runtime regressions.
def p3StorageRunDir = rootProject.file(".local/p3-storage/${UUID.randomUUID()}")
loom.runs.named('gameTest') {
    if (providers.gradleProperty('hardrushP3Storage').orNull == 'true') {
        if (['hardrushP1', 'hardrushP1TenRounds', 'hardrushP2Identity', 'hardrushP2Lobby'].any {
            providers.gradleProperty(it).orNull == 'true'
        }) throw new GradleException('P3 storage admission requires its own isolated run without -PhardrushP1=true')
        vmArg '-Dhardrush.p3.testStorage=true'
        vmArg '-Dfabric-api.gametest.filter=hardrush-gametest:p3storage_game_test*'
        runDir p3StorageRunDir.absolutePath
    }
}
tasks.named('runGameTest') {
    if (providers.gradleProperty('hardrushP3Storage').orNull == 'true') {
        doFirst {
            p3StorageRunDir.mkdirs()
            copy {
                from rootProject.file('.local/server-p0/eula.txt')
                into p3StorageRunDir
            }
            logger.lifecycle("Isolated P3 storage admission: ${p3StorageRunDir}")
        }
    }
}

// Recovery mutates the formal runtime deliberately and cannot share another regression's storage.
def p3RecoveryRunDir = rootProject.file(".local/p3-recovery/${UUID.randomUUID()}")
loom.runs.named('gameTest') {
    if (providers.gradleProperty('hardrushP3Recovery').orNull == 'true') {
        if (providers.gradleProperty('hardrushP1').orNull != 'true'
                || ['hardrushP1TenRounds', 'hardrushP2Identity', 'hardrushP2Lobby', 'hardrushP3Storage'].any {
                    providers.gradleProperty(it).orNull == 'true'
                }) throw new GradleException('P3 recovery requires -PhardrushP1=true and its own isolated run')
        vmArg '-Dhardrush.p3.testRecovery=true'
        vmArg '-Dfabric-api.gametest.filter=hardrush-gametest:p3recovery_game_test*'
        runDir p3RecoveryRunDir.absolutePath
    }
}
tasks.named('runGameTest') {
    if (providers.gradleProperty('hardrushP3Recovery').orNull == 'true') {
        doFirst {
            p3RecoveryRunDir.mkdirs()
            copy { from rootProject.file('.local/server-p0/eula.txt'); into p3RecoveryRunDir }
            logger.lifecycle("Isolated P3 recovery: ${p3RecoveryRunDir}")
        }
    }
}

// The formal P2 listener/SQLite/profile flow needs a fresh runtime, separate from legacy lobby fixtures.
def p2IdentityRunDir = rootProject.file(".local/p2-identity/${UUID.randomUUID()}")
loom.runs.named('gameTest') {
    if (providers.gradleProperty('hardrushP2Identity').orNull == 'true') {
        if (providers.gradleProperty('hardrushP1').orNull != 'true'
                || providers.gradleProperty('hardrushP1TenRounds').orNull == 'true') {
            throw new GradleException('P2 identity regression requires -PhardrushP1=true and its own run')
        }
        vmArg '-Dhardrush.p2.testIdentity=true'
        vmArg '-Dhardrush.p1.initialMode=hardcore'
        vmArg '-Dfabric-api.gametest.filter=hardrush-gametest:p2runtime_identity_game_test*'
        runDir p2IdentityRunDir.absolutePath
    }
}
tasks.named('runGameTest') {
    if (providers.gradleProperty('hardrushP2Identity').orNull == 'true') {
        doFirst {
            p2IdentityRunDir.mkdirs()
            copy {
                from rootProject.file('.local/server-p0/eula.txt')
                into p2IdentityRunDir
            }
            logger.lifecycle("Isolated P2 identity storage: ${p2IdentityRunDir}")
        }
    }
}

tasks.register('prepareDebugTools', Exec) {
    commandLine 'python3', rootProject.file('scripts/debug-tools.py'), 'prepare'
}

['runDebugServer', 'runDebugClient', 'runGameTest', 'runClientGameTest'].each { name ->
    tasks.named(name) { dependsOn 'prepareDebugTools' }
}

['runDebugServer': 'server', 'runDebugClient': 'client'].each { name, side ->
    tasks.named(name) {
        dependsOn 'debugToolsJar'
        doFirst {
            copy {
                from tasks.named('debugToolsJar').get().archiveFile
                into rootProject.file(".local/debug/${side}/mods")
            }
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.named('jar') {
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD-PARTY.md'))
    from(rootProject.file('licenses')) { into 'META-INF/licenses' }
}

// Only production artifacts: no Loom classpath, test mod, MCPFabric or debug tools.
configurations { demoFabricApi { transitive = false } }
dependencies { demoFabricApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}" }
tasks.register('stageDemoMods', Sync) {
    group = 'distribution'
    description = 'Stage the production HardRush and Fabric API JARs for an isolated 26.3 demo.'
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    from configurations.demoFabricApi
    into layout.buildDirectory.dir('demo-mods')
}


// Formal P2 lobby/sortie lifecycle, isolated from legacy fixtures and other dedicated matrices.
def p2LobbyRunDir = rootProject.file(".local/p2-lobby/${UUID.randomUUID()}")
loom.runs.named('gameTest') {
    if (providers.gradleProperty('hardrushP2Lobby').orNull == 'true') {
        if (providers.gradleProperty('hardrushP1').orNull != 'true'
                || providers.gradleProperty('hardrushP1TenRounds').orNull == 'true'
                || providers.gradleProperty('hardrushP2Identity').orNull == 'true') {
            throw new GradleException('P2 lobby regression requires -PhardrushP1=true and its own run')
        }
        vmArg '-Dhardrush.p2.testLobby=true'
        vmArg '-Dhardrush.p1.initialMode=hardcore'
        vmArg '-Dfabric-api.gametest.filter=hardrush-gametest:p2runtime_lobby_game_test*'
        runDir p2LobbyRunDir.absolutePath
    }
}
tasks.named('runGameTest') {
    if (providers.gradleProperty('hardrushP2Lobby').orNull == 'true') {
        doFirst {
            p2LobbyRunDir.mkdirs()
            copy {
                from rootProject.file('.local/server-p0/eula.txt')
                into p2LobbyRunDir
            }
            logger.lifecycle("Isolated P2 lobby storage: ${p2LobbyRunDir}")
        }
    }
}
